<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RÉSERVATION BAL | DALZON GALA 2026</title>
<style>
  :root{ 
    --gold:#D4AF37; 
    --gold-dark:#B8860B; 
    --black:#010101; 
    --glass:rgba(212,175,55,0.08);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Raleway:wght@300;400;500&display=swap');
  
  body{
    background: var(--black);
    color:#eee; 
    font-family:'Raleway', sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    background-image: 
      radial-gradient(circle at 10% 20%, rgba(212,175,55,0.15) 0%, transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(212,175,55,0.15) 0%, transparent 40%);
  }

  /* PARTICULES OR */
  #particles{position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none;}

  .wrapper{display:flex; justify-content:center; align-items:center; min-height:100vh; padding:40px 20px; position:relative; z-index:2;}

  .container{
    width:100%;
    max-width:720px;
    background:var(--glass);
    backdrop-filter:blur(25px) saturate(180%);
    border:1px solid rgba(212,175,55,0.4);
    padding:70px 60px;
    box-shadow:0 0 80px rgba(212,175,55,0.15);
    position:relative;
    animation:fadeInScale 1.2s ease;
  }
  @keyframes fadeInScale{from{opacity:0; transform:scale(0.95);} to{opacity:1; transform:scale(1);}}

  /* BORDURE OR ANIMÉE */
  .container::before{
    content:""; position:absolute; inset:0; padding:2px; 
    background:linear-gradient(45deg, var(--gold), transparent, var(--gold-dark), transparent, var(--gold));
    background-size:400% 400%;
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    animation:gradientMove 4s linear infinite;
  }
  @keyframes gradientMove{0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;}}

  .logo{text-align:center; margin-bottom:15px;}
  .logo h1{font-family:'Playfair Display'; font-size:46px; color:var(--gold); letter-spacing:10px; font-weight:900;}
  .logo .line{width:60px; height:2px; background:var(--gold); margin:10px auto;}

  .main-title{text-align:center; margin-bottom:40px;}
  .main-title h2{font-family:'Playfair Display'; font-size:54px; color:#fff; letter-spacing:8px; font-weight:700; text-shadow:0 0 20px rgba(212,175,55,0.5);}
  .main-title p{font-size:12px; letter-spacing:5px; opacity:0.7; margin-top:8px;}

  .event-info{text-align:center; margin-bottom:45px;}
  .event-info p{font-size:15px; opacity:0.9; line-height:2; font-weight:300;}
  .event-info b{color:var(--gold); font-weight:500;}

  /* 3 PRIX LUXE */
  .price-badge{display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin:40px 0;}
  .price{background:rgba(0,0,0,0.4); border:1px solid rgba(212,175,55,0.3); padding:25px 15px; text-align:center; transition:0.5s; position:relative; overflow:hidden;}
  .price::after{content:""; position:absolute; top:-50%; left:-50%; width:200%; height:200%; background:linear-gradient(45deg, transparent, rgba(212,175,55,0.2), transparent); transform:rotate(45deg); transition:0.6s;}
  .price:hover::after{left:100%;}
  .price:hover{border-color:var(--gold); transform:translateY(-8px);}
  .price .num{font-family:'Playfair Display'; font-size:28px; color:var(--gold); font-weight:700;}
  .price .label{font-size:10px; letter-spacing:3px; opacity:0.8; margin-top:5px;}

  form{display:grid; gap:22px;}
  .form-row{display:grid; grid-template-columns:1fr 1fr; gap:22px;}
  label{font-size:10px; letter-spacing:3px; opacity:0.6; margin-bottom:10px; display:block; text-transform:uppercase;}
  input, select{
    background:rgba(0,0,0,0.6); 
    border:1px solid rgba(212,175,55,0.2); 
    color:#eee; 
    padding:18px; 
    font-size:15px; 
    width:100%; 
    transition:0.4s;
    font-family:'Raleway';
    border-radius:0;
  }
  input:focus, select:focus{border-color:var(--gold); outline:none; box-shadow:0 0 20px rgba(212,175,55,0.25); background:rgba(0,0,0,0.8);}

  .btn-reserver{
    background:linear-gradient(45deg, var(--gold-dark), var(--gold)); 
    border:none; 
    color:var(--black); 
    padding:20px; 
    font-weight:600; 
    font-size:14px; 
    letter-spacing:4px;
    cursor:pointer; 
    transition:0.4s; 
    margin-top:15px;
    text-transform:uppercase;
    position:relative;
    overflow:hidden;
  }
  .btn-reserver:hover{transform:scale(1.02); box-shadow:0 0 40px rgba(212,175,55,0.6);}
  .btn-reserver::before{content:""; position:absolute; top:0; left:-100%; width:100%; height:100%; background:linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent); transition:0.5s;}
  .btn-reserver:hover::before{left:100%;}

  /* FOOTER TOUS DROITS RÉSERVÉS */
  footer{text-align:center; padding:40px 20px; border-top:1px solid rgba(212,175,55,0.2); margin-top:40px; position:relative; z-index:2;}
  footer p{font-size:12px; opacity:0.5; letter-spacing:2px;}

  #confirm{text-align:center; margin-top:20px; color:var(--gold); font-weight:500; min-height:40px; font-size:14px;}

  @media(max-width:700px){
    .container{padding:50px 30px;}
    .form-row,.price-badge{grid-template-columns:1fr;}
    .main-title h2{font-size:38px; letter-spacing:4px;}
    .logo h1{font-size:34px; letter-spacing:6px;}
  }
</style>
</head>
<body>

<canvas id="particles"></canvas>

<div class="wrapper">
  <div class="container">
    <div class="logo">
      <h1>DALZON</h1>
      <div class="line"></div>
      <p>FOUNDATION</p>
    </div>

    <div class="main-title">
      <h2>RÉSERVATION BAL</h2>
      <p>ÉDITION EXCLUSIVE 2025 - 2026</p>
    </div>

    <div class="event-info">
      <p>
        <b>Vendredi 24 Juillet 2026 • 15h15</b><br>
        Hotel Bénédiction, Goma<br>
        <b>Dress Code: Tenue de Soirée Obligatoire</b>
      </p>
    </div>

    <div class="price-badge">
      <div class="price">
        <div class="num">10$</div>
        <div class="label">CÉLIBATAIRE</div>
      </div>
      <div class="price">
        <div class="num">15$</div>
        <div class="label">COUPLE VIP</div>
      </div>
      <div class="price">
        <div class="num">40$</div>
        <div class="label">TABLE VIP</div>
      </div>
    </div>

    <form id="formReservation">
      <div class="form-row">
        <div>
          <label>Nom Complet</label>
          <input type="text" id="nom" placeholder="Votre nom" required>
        </div>
        <div>
          <label>École / Institut</label>
          <input type="text" id="ecole" placeholder="Votre école" required>
        </div>
      </div>

      <div class="form-row">
        <div>
          <label>Téléphone WhatsApp</label>
          <input type="tel" id="tel" placeholder="+243 ..." required>
        </div>
        <div>
          <label>Type de Billet</label>
          <select id="type" required>
            <option value="">Sélectionner</option>
            <option value="Célibataire - 10$">Célibataire - 10$</option>
            <option value="Couple - 15$ VIP">Couple - 15$ VIP</option>
            <option value="Table VIP - 40$">Table VIP - 40$</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div>
          <label>Mode de Paiement</label>
          <select id="paiement" required>
            <option value="">Sélectionner</option>
            <option value="Airtel Money">Airtel Money</option>
            <option value="Orange Money">Orange Money</option>
            <option value="Paiement lors de la livraison du billet">Paiement lors de la livraison du billet</option>
          </select>
        </div>
        <div id="champNumero">
          <label>Numéro de Paiement</label>
          <input type="text" id="numPaiement" placeholder="+243 ...">
        </div>
      </div>

      <button type="submit" class="btn-reserver">Confirmer la réservation</button>
    </form>

    <p id="confirm"></p>
  </div>
</div>

<footer>
  <p>© 2026 DALZON FOUNDATION. Tous droits réservés.</p>
</footer>

<script>
  // EFFET PARTICULES OR
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  let particles = [];
  for(let i=0; i<50; i++){
    particles.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, size:Math.random()*2, speed:Math.random()*0.5});
  }
  function animateParticles(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = 'rgba(212,175,55,0.6)';
    particles.forEach(p => {
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
      p.y -= p.speed; if(p.y<0) p.y=canvas.height;
    });
    requestAnimationFrame(animateParticles);
  }
  animateParticles();
  window.addEventListener('resize',()=>{canvas.width=window.innerWidth; canvas.height=window.innerHeight;});

  // LOGIQUE FORMULAIRE
  document.getElementById('paiement').addEventListener('change', function(){
    const champ = document.getElementById('champNumero');
    if(this.value === "Paiement lors de la livraison du billet"){
      champ.style.display = "none";
      document.getElementById('numPaiement').required = false;
    } else {
      champ.style.display = "block";
      document.getElementById('numPaiement').required = true;
    }
  });

  document.getElementById('formReservation').addEventListener('submit', function(e){
    e.preventDefault();
    const nom = document.getElementById('nom').value;
    const ecole = document.getElementById('ecole').value;
    const tel = document.getElementById('tel').value;
    const type = document.getElementById('type').value;
    const paiement = document.getElementById('paiement').value;
    const numPay = document.getElementById('numPaiement').value || "N/A";
    
    document.getElementById('confirm').innerHTML = "✨ Redirection vers WhatsApp...";

    const message = `*RÉSERVATION BAL DALZON 2026*%0A%0A` +
                    `👤 *Nom:* ${nom}%0A` +
                    `🏫 *École:* ${ecole}%0A` +
                    `📞 *Téléphone:* ${tel}%0A` +
                    `🎟️ *Billet:* ${type}%0A` +
                    `💳 *Paiement:* ${paiement}%0A` +
                    `🔢 *Numéro:* ${numPay}`;
    
    setTimeout(() => {
      window.open(`https://wa.me/243980772866?text=${message}`, '_blank');
    }, 800);
  });
</script>

</body>
</html>
